<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><title>Familiekalender</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f5f7fb;color:#172033}.app{max-width:1200px;margin:auto;padding:18px}.top{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}h1{margin:0;font-size:24px}.muted{color:#667085;font-size:13px}.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:700;cursor:pointer;background:#fff;box-shadow:0 2px 10px #10182814}.primary{background:#172033;color:#fff}.nav{display:flex;align-items:center;gap:8px}.nav strong{min-width:150px;text-align:center}.grid{display:grid;grid-template-columns:2.2fr 1fr;gap:16px}.card{background:#fff;border-radius:20px;box-shadow:0 4px 20px #10182810;padding:16px}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.day{min-height:390px;border:1px solid #e7eaf0;border-radius:16px;padding:9px;background:#fbfcfe}.day.today{border:2px solid #172033}.date{font-weight:800;margin-bottom:10px}.date span{display:block;font-size:11px;color:#8a94a6;text-transform:uppercase}.event{padding:8px 9px;border-radius:10px;margin:6px 0;font-size:12px;background:#eef2ff;border-left:4px solid #6172f3;cursor:pointer}.event.task{background:#ecfdf3}.event.note{background:#fff7d6;border-left-color:#f5b700!important}.season{height:110px;border-radius:18px;margin-bottom:14px;background-size:cover;background-position:center;position:relative;overflow:hidden}.season:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#10182899,transparent)}.seasonText{position:absolute;z-index:1;color:white;left:18px;bottom:14px;font-size:28px;font-weight:800;text-shadow:0 2px 8px #0006}.event.done{opacity:.45;text-decoration:line-through}.event b{display:block}.side h3{margin:4px 0 12px}.person{display:flex;align-items:center;gap:8px;padding:9px;border-radius:12px;background:#f8fafc;margin:7px 0}.dot{width:10px;height:10px;border-radius:50%}.empty{color:#98a2b3;font-size:13px}.agenda-item{padding:10px 0;border-bottom:1px solid #eee;font-size:13px}.modal{position:fixed;inset:0;background:#10182880;display:none;align-items:flex-end;justify-content:center;padding:16px;z-index:5}.modal.open{display:flex}.sheet{background:#fff;width:min(560px,100%);border-radius:24px;padding:20px}.sheet h2{margin-top:0}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}label{font-size:12px;font-weight:700;color:#667085}input,select,textarea{width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:12px;font:inherit;margin-top:5px}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}.fab{display:none}
@media(max-width:850px){.app{padding:12px}.grid{grid-template-columns:1fr}.side{order:-1}.week{display:block}.day{min-height:0;margin-bottom:9px}.day:not(.has):not(.today){display:none}.top{align-items:flex-start}.top .muted,.top>.primary{display:none}.nav strong{min-width:auto}.fab{display:block;position:fixed;right:18px;bottom:22px;width:58px;height:58px;border-radius:50%;border:0;background:#172033;color:#fff;font-size:28px;box-shadow:0 10px 30px #0004}.event{font-size:14px}}
</style></head><body><div class="app"><div class="top"><div><h1>Familien vår</h1><div class="muted">Alt som skjer – på ett sted</div></div><div class="nav"><button class="btn" id="prev">‹</button><strong id="range"></strong><button class="btn" id="next">›</button><button class="btn" id="today">I dag</button></div><button class="btn primary" id="add">＋ Legg til</button></div><div class="season" id="season"><div class="seasonText" id="seasonText"></div></div><div class="grid"><main class="card"><div class="week" id="week"></div></main><aside class="card side"><h3>Kommende</h3><div id="agenda"></div><h3 style="margin-top:22px">Familien</h3><div id="people"></div></aside></div></div><button class="fab" id="fab">＋</button>
<div class="modal" id="modal"><div class="sheet"><h2 id="modalTitle">Legg til</h2><form id="form" class="form"><div class="full"><label>Hva skal skje?<input id="title" required placeholder="F.eks. Fotballtrening"></label></div><div><label>Type<select id="type"><option value="event">Aktivitet</option><option value="task">Gjøremål</option><option value="note">Huskelapp</option></select></label></div><div><label>Hvem?<select id="person"></select></label></div><div><label>Dato<input id="date" type="date" required></label></div><div><label>Tid<input id="time" type="time"></label></div><div class="full"><label>Notat<textarea id="note" rows="2" placeholder="Sted, huskeliste eller annet"></textarea></label></div><div class="full" id="doneWrap" style="display:none"><label><input id="done" type="checkbox" style="width:auto"> Ferdig</label></div></form><div class="actions"><button class="btn" id="delete" style="display:none;color:#b42318;margin-right:auto">Slett</button><button class="btn" id="cancel">Avbryt</button><button class="btn primary" id="save">Lagre</button></div></div></div>
<script>
const P=[['Hele familien','#6172f3'],['Frode','#f79009'],['Mamma','#ee46bc'],['Theodor','#12b76a'],['Tobias','#2e90fa']];let E=JSON.parse(localStorage.getItem('familyCalendarEvents')||'[]'),C=sow(new Date()),edit=null;const $=x=>document.getElementById(x);function sow(d){d=new Date(d);d.setDate(d.getDate()-(d.getDay()+6)%7);d.setHours(0,0,0,0);return d}function iso(d){return d.toLocaleDateString('sv-SE')}function esc(s=''){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function store(){localStorage.setItem('familyCalendarEvents',JSON.stringify(E));render()}
const SEASONS=[
['Januar','linear-gradient(120deg,#c7d7e8,#5d7895)','❄️ Vinterro'],
['Februar','linear-gradient(120deg,#dce8f2,#8ba6bf)','❄️ Vinter'],
['Mars','linear-gradient(120deg,#d8e6d2,#91b68a)','🌱 Våren nærmer seg'],
['April','linear-gradient(120deg,#dff2d4,#9bc98d)','🌷 Vår'],
['Mai','linear-gradient(120deg,#d9f1c8,#7fba6d)','🌼 Lyse dager'],
['Juni','linear-gradient(120deg,#bfe7f3,#6fbdcf)','☀️ Sommer'],
['Juli','linear-gradient(120deg,#c8ecf2,#4fa8bc)','☀️ Sommerferie'],
['August','linear-gradient(120deg,#dbeab6,#9eb866)','🌾 Sensommer'],
['September','linear-gradient(120deg,#ead7a9,#c3914e)','🍂 Høst'],
['Oktober','linear-gradient(120deg,#e8c39b,#ad6c3b)','🍁 Høstfarger'],
['November','linear-gradient(120deg,#ccd0d2,#737b80)','🌧️ Sein høst'],
['Desember','linear-gradient(120deg,#d9e5ec,#7992a5)','🎄 Desember']
];
function eventHtml(e){let c=(P.find(p=>p[0]===e.person)||P[0])[1];return '<div class="event '+e.type+' '+(e.done?'done':'')+'" data-id="'+e.id+'" style="border-left-color:'+c+'"><b>'+(e.time?e.time+' · ':'')+esc(e.title)+'</b>'+esc(e.person)+(e.note?'<br>'+esc(e.note):'')+'</div>'}
function render(){let mid=new Date(C);mid.setDate(mid.getDate()+3);let ss=SEASONS[mid.getMonth()];$('season').style.backgroundImage=ss[1];$('seasonText').textContent=ss[0]+' · '+ss[2];let z=new Date(C);z.setDate(z.getDate()+6);$('range').textContent=C.toLocaleDateString('nb-NO',{day:'numeric',month:'short'})+' – '+z.toLocaleDateString('nb-NO',{day:'numeric',month:'short'});let o='';for(let i=0;i<7;i++){let d=new Date(C);d.setDate(d.getDate()+i);let ds=iso(d),a=E.filter(e=>e.date===ds).sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'));o+='<section class="day '+(ds===iso(new Date())?'today ':'')+(a.length?'has':'')+'" data-date="'+ds+'"><div class="date"><span>'+d.toLocaleDateString('nb-NO',{weekday:'long'})+'</span>'+d.getDate()+'.</div>'+(a.map(eventHtml).join('')||'<div class="empty">Ingen planer</div>')+'</section>'}$('week').innerHTML=o;let a=E.filter(e=>e.date>=iso(new Date())).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,7);$('agenda').innerHTML=a.map(e=>'<div class="agenda-item"><b>'+esc(e.title)+'</b><br>'+new Date(e.date+'T12:00').toLocaleDateString('nb-NO',{weekday:'short',day:'numeric',month:'short'})+' '+(e.time||'')+' · '+esc(e.person)+'</div>').join('')||'<div class="empty">Ingenting planlagt ennå.</div>';$('people').innerHTML=P.map(p=>'<div class="person"><i class="dot" style="background:'+p[1]+'"></i>'+p[0]+'</div>').join('');document.querySelectorAll('.event').forEach(x=>x.onclick=()=>open(E.find(e=>e.id===x.dataset.id)));document.querySelectorAll('.day').forEach(x=>x.ondblclick=()=>open(null,x.dataset.date))}
function open(e,d){edit=e?.id||null;$('modalTitle').textContent=e?'Rediger':'Legg til';$('title').value=e?.title||'';$('type').value=e?.type||'event';$('person').value=e?.person||P[0][0];$('date').value=e?.date||d||iso(new Date());$('time').value=e?.time||'';$('note').value=e?.note||'';$('done').checked=!!e?.done;$('doneWrap').style.display=['task','note'].includes($('type').value)?'block':'none';$('delete').style.display=e?'block':'none';$('modal').classList.add('open');setTimeout(()=>$('title').focus(),50)}function close(){$('modal').classList.remove('open');edit=null}
$('person').innerHTML=P.map(p=>'<option>'+p[0]+'</option>').join('');$('type').onchange=()=>$('doneWrap').style.display=['task','note'].includes($('type').value)?'block':'none';$('save').onclick=()=>{if(!$('form').reportValidity())return;let x={id:edit||crypto.randomUUID(),title:$('title').value.trim(),type:$('type').value,person:$('person').value,date:$('date').value,time:$('time').value,note:$('note').value.trim(),done:$('done').checked};E=edit?E.map(e=>e.id===edit?x:e):[...E,x];store();close()};$('delete').onclick=()=>{if(confirm('Slette denne?')){E=E.filter(e=>e.id!==edit);store();close()}};$('cancel').onclick=close;$('modal').onclick=e=>{if(e.target===$('modal'))close()};$('add').onclick=$('fab').onclick=()=>open();$('prev').onclick=()=>{C.setDate(C.getDate()-7);render()};$('next').onclick=()=>{C.setDate(C.getDate()+7);render()};$('today').onclick=()=>{C=sow(new Date());render()};render();
</script></body></html>
