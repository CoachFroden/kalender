<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><title>Familiekalender</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;color:#14233b;background:#eef2f6}.shell{min-height:100vh;display:grid;grid-template-columns:190px 1fr;background:linear-gradient(135deg,#eef4fa,#f7f2ed)}.sidebar{padding:22px 14px;background:#f8fafce8;border-right:1px solid #dfe5ec;backdrop-filter:blur(14px)}.brand{font-size:20px;font-weight:850;margin:0 8px 4px}.tag{font-size:11px;color:#667085;margin:0 8px 26px}.menu{display:grid;gap:8px}.menu button{border:0;background:transparent;text-align:left;padding:12px;border-radius:10px;font:inherit;color:#344054;cursor:pointer}.menu button.active{background:#dfe6ef;color:#102a4c;font-weight:800}.content{padding:18px;min-width:0;max-width:1500px;width:100%;margin:0 auto}.hero{height:190px;border-radius:22px 22px 0 0;position:relative;overflow:hidden;background-image:url('months.webp');background-size:300% 400%;background-repeat:no-repeat;background-color:#5d7895;max-width:100%}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#0d1b2a99,transparent 70%)}.heroTitle{position:absolute;z-index:1;left:28px;bottom:22px;color:#fff}.heroTitle h1{font-size:42px;margin:0;line-height:1}.heroTitle div{margin-top:7px;font-size:18px;font-style:italic}.workspace{margin-top:-1px;display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:14px}.calendarCard,.panel{background:#fff;border-radius:0 0 18px 18px;box-shadow:0 8px 30px #25324a12}.calendarCard{padding:14px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.nav,.views{display:flex;gap:6px;align-items:center}.btn{border:1px solid #dce2e9;background:#f9fafb;border-radius:9px;padding:9px 12px;font-weight:700;cursor:pointer;color:#26364d}.primary{background:#263b50;color:white;border-color:#263b50}.range{font-weight:850;min-width:170px;text-align:center}.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid #dfe4ea;border-radius:10px;overflow:hidden}.day{min-height:440px;border-right:1px solid #e2e6eb;padding:9px;background:#fff}.day:last-child{border:0}.day.today{background:#f7fbff;box-shadow:inset 0 3px #2e90fa}.date{text-align:center;font-weight:800;margin-bottom:10px}.date span{display:block;font-size:11px;text-transform:capitalize;color:#667085;margin-bottom:5px}.event{font-size:11px;padding:7px 8px;margin:6px 0;border-radius:6px;background:#dff3ff;border-left:4px solid;cursor:pointer}.event.task{background:#e6f8ed}.event.note{background:#fff1a8!important;border-left-color:#e5b000!important}.event.done{opacity:.45;text-decoration:line-through}.event b{display:block}.right{display:grid;gap:12px;align-content:start}.panel{border-radius:16px;padding:15px}.panel h3{margin:0 0 11px}.agenda-item{padding:9px 0;border-bottom:1px solid #edf0f3;font-size:12px}.person{display:flex;align-items:center;gap:7px;font-size:12px;margin:8px 0}.dot{width:10px;height:10px;border-radius:50%}.reminder{background:#fff6c8;border:1px solid #f5df76;border-radius:7px;padding:8px;margin:7px 0;font-size:12px}.empty{font-size:12px;color:#98a2b3}.modal{position:fixed;inset:0;background:#10182888;display:none;align-items:flex-end;justify-content:center;padding:16px;z-index:10}.modal.open{display:flex}.sheet{background:#fff;width:min(560px,100%);border-radius:22px;padding:20px}.sheet h2{margin-top:0}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}label{font-size:12px;font-weight:700;color:#667085}input,select,textarea{width:100%;padding:11px;border:1px solid #d0d5dd;border-radius:10px;font:inherit;margin-top:5px}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}.fab{display:none}@media(max-width:900px){.hero{height:140px!important}.shell{display:block}.sidebar{display:none}.content{padding:10px}.hero{height:125px;border-radius:16px}.heroTitle h1{font-size:32px}.workspace{display:block}.right{margin-top:12px}.week{display:block;border:0}.day{min-height:0;border:1px solid #e2e6eb!important;border-radius:10px;margin:8px 0}.day:not(.has):not(.today){display:none}.toolbar{flex-wrap:wrap}.views{display:none}.fab{display:block;position:fixed;right:18px;bottom:20px;width:58px;height:58px;border:0;border-radius:50%;background:#263b50;color:#fff;font-size:27px;z-index:5}.right .panel:first-child{display:none}}</style></head><body><div class="shell"><aside class="sidebar"><div class="brand">👨‍👩‍👦‍👦 Familiekalender</div><div class="tag">Aktiviteter · Gjøremål · Huskelapper</div><div class="menu"><button class="active">▣ &nbsp; Kalender</button><button>☷ &nbsp; Kommende</button><button>☑ &nbsp; Gjøremål</button><button>▱ &nbsp; Huskelapper</button><button>♟ &nbsp; Familie</button></div></aside><div class="content"><div class="hero" id="season"><div class="heroTitle"><h1 id="monthTitle"></h1><div id="seasonText"></div></div></div><div class="workspace"><main class="calendarCard"><div class="toolbar"><div class="nav"><button class="btn" id="prev">‹</button><button class="btn" id="today">I dag</button><button class="btn" id="next">›</button><span class="range" id="range"></span></div><div class="views"><button class="btn primary">Uke</button><button class="btn" id="add">＋ Legg til</button></div></div><div class="week" id="week"></div></main><aside class="right"><section class="panel"><h3>Kommende aktiviteter</h3><div id="agenda"></div></section><section class="panel"><h3>Huskelapper</h3><div id="reminders"></div><button class="btn" onclick="openNote()">＋ Legg til huskelapp</button></section><section class="panel"><h3>Familien</h3><div id="people"></div></section></aside></div></div></div><button class="fab" id="fab">＋</button><div class="modal" id="modal"><div class="sheet"><h2 id="modalTitle">Legg til</h2><form id="form" class="form"><div class="full"><label>Hva skal skje?<input id="title" required placeholder="F.eks. Fotballtrening"></label></div><div><label>Type<select id="type"><option value="event">Aktivitet</option><option value="task">Gjøremål</option><option value="note">Huskelapp</option></select></label></div><div><label>Hvem?<select id="person"></select></label></div><div><label>Dato<input id="date" type="date" required></label></div><div><label>Tid<input id="time" type="time"></label></div><div class="full"><label>Notat<textarea id="note" rows="2" placeholder="Sted, huskeliste eller annet"></textarea></label></div><div class="full" id="doneWrap" style="display:none"><label><input id="done" type="checkbox" style="width:auto"> Ferdig</label></div></form><div class="actions"><button class="btn" id="delete" style="display:none;color:#b42318;margin-right:auto">Slett</button><button class="btn" id="cancel">Avbryt</button><button class="btn primary" id="save">Lagre</button></div></div></div>
<script>
const P=[['Hele familien','#6172f3'],['Frode','#f79009'],['Mamma','#ee46bc'],['Theodor','#12b76a'],['Tobias','#2e90fa']];let E=JSON.parse(localStorage.getItem('familyCalendarEvents')||'[]'),C=sow(new Date()),edit=null;const $=x=>document.getElementById(x);function sow(d){d=new Date(d);d.setDate(d.getDate()-(d.getDay()+6)%7);d.setHours(0,0,0,0);return d}function iso(d){return d.toLocaleDateString('sv-SE')}function esc(s=''){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function store(){localStorage.setItem('familyCalendarEvents',JSON.stringify(E));render()}
const SEASONS=[
['Januar','linear-gradient(120deg,#244d70,#b8d4e7)','❄️ Vinterro'],['Februar','linear-gradient(120deg,#315d78,#d8e7ef)','❄️ Vinterdager'],['Mars','linear-gradient(120deg,#557c68,#c8dcc5)','🌱 Våren nærmer seg'],['April','linear-gradient(120deg,#76a56d,#dcebc9)','🌷 Våren våkner'],['Mai','linear-gradient(120deg,#4e8d65,#dce9a7)','🌼 Lyse dager'],['Juni','linear-gradient(120deg,#398aa3,#c5e9ec)','☀️ Sommer'],['Juli','linear-gradient(120deg,#217d9b,#bfe8ed)','☀️ Sommerferie'],['August','linear-gradient(120deg,#7e9255,#e8ddb0)','🌾 Sensommer'],['September','linear-gradient(120deg,#9b7545,#ead4a5)','🍂 Høstdager'],['Oktober','linear-gradient(120deg,#864d2f,#dca36b)','🍁 Høstfarger'],['November','linear-gradient(120deg,#515e67,#b8c2c8)','🌧️ Sein høst'],['Desember','linear-gradient(120deg,#254b62,#cbdde7)','🎄 Desember']
];
function eventHtml(e){let c=(P.find(p=>p[0]===e.person)||P[0])[1];return '<div class="event '+e.type+' '+(e.done?'done':'')+'" data-id="'+e.id+'" style="border-left-color:'+c+'"><b>'+(e.time?e.time+' · ':'')+esc(e.title)+'</b>'+esc(e.person)+(e.note?'<br>'+esc(e.note):'')+'</div>'}
function render(){let mid=new Date(C);mid.setDate(mid.getDate()+3);let ss=SEASONS[mid.getMonth()],mi=mid.getMonth(),col=mi%3,row=Math.floor(mi/3);$('season').style.backgroundImage="url('months.webp')";$('season').style.backgroundSize='300% 400%';$('season').style.backgroundPosition=(col*50)+'% '+(row*33.333)+'%';$('monthTitle').textContent=ss[0]+' '+mid.getFullYear();$('seasonText').textContent=ss[2];let z=new Date(C);z.setDate(z.getDate()+6);$('range').textContent=C.toLocaleDateString('nb-NO',{day:'numeric',month:'short'})+' – '+z.toLocaleDateString('nb-NO',{day:'numeric',month:'short'});let o='';for(let i=0;i<7;i++){let d=new Date(C);d.setDate(d.getDate()+i);let ds=iso(d),a=E.filter(e=>e.date===ds).sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'));o+='<section class="day '+(ds===iso(new Date())?'today ':'')+(a.length?'has':'')+'" data-date="'+ds+'"><div class="date"><span>'+d.toLocaleDateString('nb-NO',{weekday:'long'})+'</span>'+d.getDate()+'.</div>'+(a.map(eventHtml).join('')||'<div class="empty">Ingen planer</div>')+'</section>'}$('week').innerHTML=o;let a=E.filter(e=>e.date>=iso(new Date())).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,7);$('agenda').innerHTML=a.map(e=>'<div class="agenda-item"><b>'+esc(e.title)+'</b><br>'+new Date(e.date+'T12:00').toLocaleDateString('nb-NO',{weekday:'short',day:'numeric',month:'short'})+' '+(e.time||'')+' · '+esc(e.person)+'</div>').join('')||'<div class="empty">Ingenting planlagt ennå.</div>';let notes=E.filter(e=>e.type==='note'&&e.date>=iso(new Date())).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5);$('reminders').innerHTML=notes.map(e=>'<div class="reminder"><b>📝 '+esc(e.title)+'</b><br>'+new Date(e.date+'T12:00').toLocaleDateString('nb-NO',{day:'numeric',month:'short'})+' · '+esc(e.person)+'</div>').join('')||'<div class="empty" style="margin-bottom:10px">Ingen huskelapper.</div>';$('people').innerHTML=P.map(p=>'<div class="person"><i class="dot" style="background:'+p[1]+'"></i>'+p[0]+'</div>').join('');document.querySelectorAll('.event').forEach(x=>x.onclick=()=>open(E.find(e=>e.id===x.dataset.id)));document.querySelectorAll('.day').forEach(x=>x.ondblclick=()=>open(null,x.dataset.date))}
function openNote(){open();$('type').value='note';$('doneWrap').style.display='block'}function open(e,d){edit=e?.id||null;$('modalTitle').textContent=e?'Rediger':'Legg til';$('title').value=e?.title||'';$('type').value=e?.type||'event';$('person').value=e?.person||P[0][0];$('date').value=e?.date||d||iso(new Date());$('time').value=e?.time||'';$('note').value=e?.note||'';$('done').checked=!!e?.done;$('doneWrap').style.display=['task','note'].includes($('type').value)?'block':'none';$('delete').style.display=e?'block':'none';$('modal').classList.add('open');setTimeout(()=>$('title').focus(),50)}function close(){$('modal').classList.remove('open');edit=null}
$('person').innerHTML=P.map(p=>'<option>'+p[0]+'</option>').join('');$('type').onchange=()=>$('doneWrap').style.display=['task','note'].includes($('type').value)?'block':'none';$('save').onclick=()=>{if(!$('form').reportValidity())return;let x={id:edit||crypto.randomUUID(),title:$('title').value.trim(),type:$('type').value,person:$('person').value,date:$('date').value,time:$('time').value,note:$('note').value.trim(),done:$('done').checked};E=edit?E.map(e=>e.id===edit?x:e):[...E,x];store();close()};$('delete').onclick=()=>{if(confirm('Slette denne?')){E=E.filter(e=>e.id!==edit);store();close()}};$('cancel').onclick=close;$('modal').onclick=e=>{if(e.target===$('modal'))close()};$('add').onclick=$('fab').onclick=()=>open();$('prev').onclick=()=>{C.setDate(C.getDate()-7);render()};$('next').onclick=()=>{C.setDate(C.getDate()+7);render()};$('today').onclick=()=>{C=sow(new Date());render()};render();
</script></body></html>
